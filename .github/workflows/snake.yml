name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#10B981&color_dots=#2d3343,#0e7490,#22D3EE,#A78BFA,#10B981
            dist/github-contribution-grid-snake-dark.svg?color_snake=#10B981&color_dots=#2d3343,#0e7490,#22D3EE,#A78BFA,#10B981
            dist/github-contribution-grid-snake-light.svg?color_snake=#059669&color_dots=#ebedf0,#93c5fd,#38bdf8,#0891b2,#7c3aed

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
